en:
  PLUGIN_EASYFORMS:
    MENU: 'Forms'
    EDITOR_TITLE: 'Easy Forms - Form Editor'
    TAB_GENERAL: 'General'
    TAB_FIELDS: 'Fields'
    TAB_EMAIL: 'Email'
    TAB_ACTIONS: 'Actions & Feedback'
    TAB_ANTISPAM: 'Spam Protection'
    TAB_AUTORESPONDER: 'Confirmation Email'
    FIELD_ANTISPAM_METHOD: 'Spam protection method'
    FIELD_ANTISPAM_METHOD_HELP: 'Honeypot is invisible to visitors, needs no consent banner, and is enough to stop most automated spam. The others only matter for a form under active, targeted attack.'
    ANTISPAM_NONE: 'None'
    ANTISPAM_HONEYPOT: 'Honeypot (recommended, invisible, no tracking)'
    ANTISPAM_MATH: 'Math question (simple challenge)'
    ANTISPAM_TURNSTILE: 'Cloudflare Turnstile'
    ANTISPAM_RECAPTCHA: 'Google reCAPTCHA v3'
    FIELD_HONEYPOT_NAME: 'Decoy field name'
    FIELD_HONEYPOT_NAME_HELP: 'A hidden field bots tend to fill in but real visitors never see. Only used when the method above is Honeypot.'
    FIELD_HONEYPOT_MESSAGE: 'Message on detection'
    FIELD_HONEYPOT_MESSAGE_HELP: 'Leave empty to silently show the normal success message instead (recommended — gives an automated submitter no sign it was caught).'
    FIELD_MATH_LABEL: 'Question label'
    FIELD_MATH_LABEL_HELP: 'Use {a} and {b} as placeholders for the two numbers. Only used when the method above is Math question.'
    DEFAULT_MATH_LABEL: 'Security question: what is {a} + {b}?'
    FIELD_MATH_MESSAGE: 'Message on wrong answer'
    DEFAULT_MATH_MESSAGE: 'That answer wasn''t quite right — please try again.'
    FIELD_ANTISPAM_SITE_KEY: 'Site key (public)'
    FIELD_ANTISPAM_SITE_KEY_HELP: 'Only used for Turnstile or reCAPTCHA. Leave empty to use the global key from the plugin''s own settings (Admin > Plugins > Easy Forms), if one is set there.'
    FIELD_ANTISPAM_SECRET_KEY: 'Secret key (private)'
    FIELD_ANTISPAM_SECRET_KEY_HELP: 'Only used for Turnstile or reCAPTCHA. Leave empty to use the global key from the plugin''s own settings, if one is set there.'
    FIELD_GLOBAL_TURNSTILE_SITE_KEY: 'Turnstile site key (global default)'
    FIELD_GLOBAL_TURNSTILE_SECRET_KEY: 'Turnstile secret key (global default)'
    FIELD_GLOBAL_RECAPTCHA_SITE_KEY: 'reCAPTCHA site key (global default)'
    FIELD_GLOBAL_RECAPTCHA_SECRET_KEY: 'reCAPTCHA secret key (global default)'
    FIELD_GLOBAL_KEY_HELP: 'Used by any form set to this method that doesn''t have its own key entered.'
    ANTISPAM_MATH_ERROR: 'That answer wasn''t quite right — please try again.'
    FIELD_NAME: 'Form name (slug)'
    FIELD_NAME_HELP: 'Technical identifier, used as the filename and in the shortcode below (lowercase letters, numbers and hyphens only, e.g. "kontakt").'
    INTRO_HELP: "**How to use a form:** add or edit a form below, fill in its fields, and save. Every form gets its own shortcode, e.g. `[easyform name=\"kontakt\"]` — copy that and paste it into the content of any page (or a Markdown editor block) to show the form there."
    FIELD_SHORTCODE_HELP: 'Copy this and paste it into a page''s content to show the form there.'
    FIELD_TITLE: 'Form title'
    FIELD_TITLE_HELP: 'Optional heading shown above the form.'
    FIELD_FIELDS: 'Fields'
    ADD_FIELD: 'Add field'
    FIELD_FIELDNAME: 'Field name'
    FIELD_FIELDNAME_HELP: 'Technical name of this field (used as the key in submissions and emails).'
    FIELD_LABEL: 'Label'
    FIELD_TYPE: 'Type'
    FIELD_PLACEHOLDER: 'Placeholder'
    FIELD_REQUIRED: 'Required'
    FIELD_SHOW_IF_FIELD: 'Show only if field'
    FIELD_SHOW_IF_FIELD_HELP: 'Technical name of another field on this form. Leave empty to always show this field.'
    FIELD_SHOW_IF_VALUE: 'Show only if value equals'
    FIELD_SHOW_IF_VALUE_HELP: 'This field is shown (and, if required, enforced) only while the field above has this exact value. For a checkbox, use "1" for checked.'
    FIELD_OPTIONS: 'Options'
    FIELD_OPTIONS_HELP: 'Only used when type is "Select".'
    FIELD_OPTION_KEY: 'Value'
    FIELD_OPTION_VALUE: 'Label'
    TYPE_TEXT: 'Text'
    TYPE_EMAIL: 'Email'
    TYPE_TEXTAREA: 'Textarea'
    TYPE_DATE: 'Date'
    TYPE_CHECKBOX: 'Checkbox'
    TYPE_SELECT: 'Select'
    TYPE_FILE: 'File'
    FIELD_EMAIL_ENABLED: 'Send email on submit'
    FIELD_TO: 'To'
    FIELD_TO_HELP: 'Recipient address. Leave empty to use the site-wide default (plugins.email.to).'
    FIELD_FROM: 'From'
    FIELD_FROM_HELP: 'Sender address. Leave empty to use the site-wide default (plugins.email.from).'
    FIELD_REPLY_TO: 'Reply-To'
    FIELD_REPLY_TO_HELP: 'Optional. To let you reply directly to the visitor, enter {{ form.value.email }} here, replacing "email" with the technical name of your email field.'
    FIELD_SUBJECT: 'Subject'
    FIELD_MESSAGE: 'Success message'
    FIELD_MESSAGE_HELP: 'Shown to the visitor after a successful submission.'
    DEFAULT_MESSAGE: 'Thank you for your message!'
    FIELD_RESET: 'Clear form after submit'
    FIELD_RESET_HELP: 'Ignored if a redirect URL is set below.'
    FIELD_REDIRECT: 'Redirect URL'
    FIELD_REDIRECT_HELP: 'Optional. If set, the visitor is redirected here after a successful submission.'
    FIELD_SAVE_ENABLED: 'Save submissions to file'
    FIELD_SAVE_ENABLED_HELP: 'Stores each submission under user/data/easyforms-submissions/{form-name}/.'
    FIELD_RETENTION_DAYS: 'Auto-delete after (days)'
    FIELD_RETENTION_DAYS_HELP: 'GDPR data minimization: submissions older than this are deleted automatically. 0 disables auto-deletion.'
    FIELD_AUTORESPONDER_ENABLED: 'Send confirmation email'
    FIELD_AUTORESPONDER_ENABLED_HELP: 'Sends an automatic acknowledgement to the visitor, alongside (not instead of) the notification email above.'
    FIELD_AUTORESPONDER_FIELD: 'Recipient field'
    FIELD_AUTORESPONDER_FIELD_HELP: 'Technical name of the field holding the visitor''s own email address.'
    FIELD_AUTORESPONDER_MESSAGE: 'Message text'
    FIELD_AUTORESPONDER_MESSAGE_HELP: 'Supports variables like {{ form.value.name }} to reference the visitor''s submitted values.'
    DEFAULT_AUTORESPONDER_MESSAGE: 'Thank you for your message, {{ form.value.name }}! We received it and will get back to you soon.'
    FIELD_DELETE: 'Delete this form on next save'
    FIELD_DELETE_HELP: 'Warning: cannot be undone. Deletes the form and its saved submissions.'
    SUBMIT: 'Submit'
    BACK_TO_LIST: 'Back to forms'
    ADD: 'New form'
    EDIT: 'Edit'
    DELETE: 'Delete'
    SAVE: 'Save'
    COPY: 'Copy'
    COL_TITLE: 'Title'
    COL_NAME: 'Name'
    COL_SHORTCODE: 'Shortcode'
    NO_FORMS: 'No forms have been created yet.'
    CONFIRM_DELETE: 'Delete this form? This cannot be undone.'
    SUBMISSIONS: 'Submissions'
    BACK_TO_SUBMISSIONS: 'Back to submissions'
    EXPORT_CSV: 'Export CSV'
    COL_DATE: 'Date'
    COL_STATUS: 'Status'
    COL_SUMMARY: 'Submissions'
    MARK_READ: 'Mark as read'
    MARK_UNREAD: 'Mark as unread'
    NO_SUBMISSIONS: 'No submissions yet.'
    NO_SUBMISSION: 'Submission not found.'
    CONFIRM_DELETE_SUBMISSION: 'Delete this submission? This cannot be undone.'
    SUBMISSION_DELETED: 'Submission deleted.'
    PREVIEW: 'Preview'
    PREVIEW_BANNER: 'Preview — this shows the last saved version of the form and cannot actually be submitted here. Save your changes first to see them reflected in this preview.'
    PREVIEW_NOT_SAVED: 'This form has not been saved yet. Save it first to see a preview.'
    PREVIEW_ERROR: 'The preview could not be rendered.'
    PREVIEW_SAVE_FIRST: 'Save this form first to preview it.'
    SAVED: 'Form saved.'
    DELETED: 'Form deleted.'
    ERROR_INVALID_NAME: 'Please enter a valid form name (lowercase letters, numbers and hyphens only).'
    ERROR_NAME_TAKEN: 'A form with this name already exists.'
    FIELD_GITHUB_REPO: 'GitHub repository'
    FIELD_GITHUB_REPO_HELP: 'owner/repo, e.g. "myusername/easyform". Leave empty to disable update checks.'
    UPDATE_TITLE: 'Update'
    CURRENT_VERSION: 'Current version'
    LATEST_VERSION: 'Latest version'
    RELEASE_NOTES: 'Release notes'
    APPLY_UPDATE: 'Update now'
    APPLY_UPDATE_HELP: 'Downloads and installs the latest GitHub release in place. The previous version is kept as a backup folder next to the plugin.'
    UPDATE_AVAILABLE: 'Update available'
    UPDATE_CHECK_FAILED: 'Update check failed'
    CONFIRM_UPDATE: 'Update Easy Forms now? The site will briefly be affected while files are replaced.'

de:
  PLUGIN_EASYFORMS:
    MENU: 'Formulare'
    EDITOR_TITLE: 'Easy Forms - Formular-Editor'
    TAB_GENERAL: 'Allgemein'
    TAB_FIELDS: 'Felder'
    TAB_EMAIL: 'E-Mail-Versand'
    TAB_ACTIONS: 'Aktionen & Feedback'
    TAB_ANTISPAM: 'Spam-Schutz'
    TAB_AUTORESPONDER: 'Bestätigungs-E-Mail'
    FIELD_ANTISPAM_METHOD: 'Spam-Schutz-Methode'
    FIELD_ANTISPAM_METHOD_HELP: 'Honeypot ist für Besucher unsichtbar, braucht keinen Cookie-Hinweis und reicht gegen die meisten automatisierten Spam-Bots aus. Die anderen Methoden lohnen sich nur, wenn ein Formular gezielt angegriffen wird.'
    ANTISPAM_NONE: 'Kein Spam-Schutz'
    ANTISPAM_HONEYPOT: 'Honeypot (empfohlen, unsichtbar, ohne Tracking)'
    ANTISPAM_MATH: 'Rechenaufgabe (einfache Sicherheitsfrage)'
    ANTISPAM_TURNSTILE: 'Cloudflare Turnstile'
    ANTISPAM_RECAPTCHA: 'Google reCAPTCHA v3'
    FIELD_HONEYPOT_NAME: 'Name des Köder-Felds'
    FIELD_HONEYPOT_NAME_HELP: 'Ein verstecktes Feld, das Bots gerne ausfüllen, echte Besucher aber nie sehen. Nur relevant, wenn oben "Honeypot" gewählt ist.'
    FIELD_HONEYPOT_MESSAGE: 'Meldung bei Erkennung'
    FIELD_HONEYPOT_MESSAGE_HELP: 'Leer lassen, um stattdessen still die normale Erfolgsmeldung zu zeigen (empfohlen — der Bot merkt so nicht, dass er erkannt wurde).'
    FIELD_MATH_LABEL: 'Beschriftung der Frage'
    FIELD_MATH_LABEL_HELP: '{a} und {b} als Platzhalter für die beiden Zahlen verwenden. Nur relevant, wenn oben "Rechenaufgabe" gewählt ist.'
    DEFAULT_MATH_LABEL: 'Sicherheitsfrage: Was ist {a} + {b}?'
    FIELD_MATH_MESSAGE: 'Meldung bei falscher Antwort'
    DEFAULT_MATH_MESSAGE: 'Das war leider nicht richtig — bitte nochmal versuchen.'
    FIELD_ANTISPAM_SITE_KEY: 'Site Key (öffentlich)'
    FIELD_ANTISPAM_SITE_KEY_HELP: 'Nur für Turnstile oder reCAPTCHA relevant. Leer lassen, um den globalen Schlüssel aus den Plugin-Einstellungen (Admin > Plugins > Easy Forms) zu verwenden, falls dort einer hinterlegt ist.'
    FIELD_ANTISPAM_SECRET_KEY: 'Secret Key (privat)'
    FIELD_ANTISPAM_SECRET_KEY_HELP: 'Nur für Turnstile oder reCAPTCHA relevant. Leer lassen, um den globalen Schlüssel aus den Plugin-Einstellungen zu verwenden, falls dort einer hinterlegt ist.'
    FIELD_GLOBAL_TURNSTILE_SITE_KEY: 'Turnstile Site Key (globaler Standard)'
    FIELD_GLOBAL_TURNSTILE_SECRET_KEY: 'Turnstile Secret Key (globaler Standard)'
    FIELD_GLOBAL_RECAPTCHA_SITE_KEY: 'reCAPTCHA Site Key (globaler Standard)'
    FIELD_GLOBAL_RECAPTCHA_SECRET_KEY: 'reCAPTCHA Secret Key (globaler Standard)'
    FIELD_GLOBAL_KEY_HELP: 'Wird von jedem Formular mit dieser Methode verwendet, das keinen eigenen Schlüssel hinterlegt hat.'
    ANTISPAM_MATH_ERROR: 'Das war leider nicht richtig — bitte nochmal versuchen.'
    FIELD_NAME: 'Formularname (Slug)'
    FIELD_NAME_HELP: 'Technische Kennung, wird als Dateiname und im Shortcode unten verwendet (nur Kleinbuchstaben, Zahlen und Bindestriche, z. B. "kontakt").'
    INTRO_HELP: "**So verwendest du ein Formular:** Lege unten ein Formular an oder bearbeite eines, fülle die Felder aus und speichere. Jedes Formular bekommt automatisch einen eigenen Shortcode, z. B. `[easyform name=\"kontakt\"]` — kopiere diesen und füge ihn in den Inhalt einer beliebigen Seite ein, dort erscheint das Formular dann."
    FIELD_SHORTCODE_HELP: 'Diesen Code kopieren und in den Inhalt einer Seite einfügen, um das Formular dort anzuzeigen.'
    FIELD_TITLE: 'Formular-Titel'
    FIELD_TITLE_HELP: 'Optionale Überschrift oberhalb des Formulars.'
    FIELD_FIELDS: 'Felder'
    ADD_FIELD: 'Feld hinzufügen'
    FIELD_FIELDNAME: 'Technischer Feldname'
    FIELD_FIELDNAME_HELP: 'Technischer Name dieses Feldes (Schlüssel in Einreichungen und E-Mails).'
    FIELD_LABEL: 'Label'
    FIELD_TYPE: 'Typ'
    FIELD_PLACEHOLDER: 'Platzhalter'
    FIELD_REQUIRED: 'Pflichtfeld'
    FIELD_SHOW_IF_FIELD: 'Nur anzeigen wenn Feld'
    FIELD_SHOW_IF_FIELD_HELP: 'Technischer Name eines anderen Feldes in diesem Formular. Leer lassen, um dieses Feld immer anzuzeigen.'
    FIELD_SHOW_IF_VALUE: 'Nur anzeigen wenn Wert gleich'
    FIELD_SHOW_IF_VALUE_HELP: 'Dieses Feld wird nur angezeigt (und, falls Pflichtfeld, nur dann verlangt), solange das obige Feld genau diesen Wert hat. Bei einer Checkbox "1" für angehakt verwenden.'
    FIELD_OPTIONS: 'Optionen'
    FIELD_OPTIONS_HELP: 'Nur bei Typ "Auswahl (Select)" relevant.'
    FIELD_OPTION_KEY: 'Wert'
    FIELD_OPTION_VALUE: 'Beschriftung'
    TYPE_TEXT: 'Text'
    TYPE_EMAIL: 'E-Mail'
    TYPE_TEXTAREA: 'Textarea'
    TYPE_DATE: 'Datum'
    TYPE_CHECKBOX: 'Checkbox'
    TYPE_SELECT: 'Auswahl (Select)'
    TYPE_FILE: 'Datei'
    FIELD_EMAIL_ENABLED: 'E-Mail beim Absenden versenden'
    FIELD_TO: 'Empfänger'
    FIELD_TO_HELP: 'Leer lassen, um die globale Standardadresse (plugins.email.to) zu verwenden.'
    FIELD_FROM: 'Absender'
    FIELD_FROM_HELP: 'Leer lassen, um die globale Standardadresse (plugins.email.from) zu verwenden.'
    FIELD_REPLY_TO: 'Antwort an (Reply-To)'
    FIELD_REPLY_TO_HELP: 'Optional. Damit du direkt an den Besucher antworten kannst, hier {{ form.value.email }} eintragen und "email" durch den technischen Namen deines E-Mail-Feldes ersetzen.'
    FIELD_SUBJECT: 'Betreff'
    FIELD_MESSAGE: 'Erfolgsmeldung'
    FIELD_MESSAGE_HELP: 'Wird dem Besucher nach erfolgreichem Absenden angezeigt.'
    DEFAULT_MESSAGE: 'Vielen Dank für Ihre Nachricht!'
    FIELD_RESET: 'Formular nach Absenden leeren'
    FIELD_RESET_HELP: 'Wird ignoriert, wenn unten eine Weiterleitungs-URL gesetzt ist.'
    FIELD_REDIRECT: 'Weiterleitung (URL)'
    FIELD_REDIRECT_HELP: 'Optional. Falls gesetzt, wird nach erfolgreichem Absenden dorthin weitergeleitet.'
    FIELD_SAVE_ENABLED: 'Einreichungen in Datei speichern'
    FIELD_SAVE_ENABLED_HELP: 'Speichert jede Einreichung unter user/data/easyforms-submissions/{form-name}/.'
    FIELD_RETENTION_DAYS: 'Automatisch löschen nach (Tagen)'
    FIELD_RETENTION_DAYS_HELP: 'DSGVO-Datensparsamkeit: Einreichungen, die älter sind, werden automatisch gelöscht. 0 deaktiviert die automatische Löschung.'
    FIELD_AUTORESPONDER_ENABLED: 'Bestätigungs-E-Mail senden'
    FIELD_AUTORESPONDER_ENABLED_HELP: 'Sendet dem Besucher automatisch eine Eingangsbestätigung, zusätzlich zur (nicht anstelle der) obigen Benachrichtigungs-E-Mail.'
    FIELD_AUTORESPONDER_FIELD: 'Empfänger-Feld'
    FIELD_AUTORESPONDER_FIELD_HELP: 'Technischer Name des Feldes mit der E-Mail-Adresse des Besuchers.'
    FIELD_AUTORESPONDER_MESSAGE: 'Nachrichtentext'
    FIELD_AUTORESPONDER_MESSAGE_HELP: 'Unterstützt Variablen wie {{ form.value.name }}, um auf die eingereichten Werte des Besuchers zu verweisen.'
    DEFAULT_AUTORESPONDER_MESSAGE: 'Vielen Dank für Ihre Nachricht, {{ form.value.name }}! Wir haben sie erhalten und melden uns bald bei Ihnen.'
    FIELD_DELETE: 'Dieses Formular beim nächsten Speichern löschen'
    FIELD_DELETE_HELP: 'Achtung: kann nicht rückgängig gemacht werden. Löscht das Formular und seine gespeicherten Einreichungen.'
    SUBMIT: 'Absenden'
    BACK_TO_LIST: 'Zurück zur Übersicht'
    ADD: 'Neues Formular'
    EDIT: 'Bearbeiten'
    DELETE: 'Löschen'
    SAVE: 'Speichern'
    COPY: 'Kopieren'
    COL_TITLE: 'Titel'
    COL_NAME: 'Name'
    COL_SHORTCODE: 'Shortcode'
    NO_FORMS: 'Es wurden noch keine Formulare erstellt.'
    CONFIRM_DELETE: 'Dieses Formular löschen? Das kann nicht rückgängig gemacht werden.'
    SUBMISSIONS: 'Einreichungen'
    BACK_TO_SUBMISSIONS: 'Zurück zu den Einreichungen'
    EXPORT_CSV: 'CSV exportieren'
    COL_DATE: 'Datum'
    COL_STATUS: 'Status'
    COL_SUMMARY: 'Einreichungen'
    MARK_READ: 'Als gelesen markieren'
    MARK_UNREAD: 'Als ungelesen markieren'
    NO_SUBMISSIONS: 'Noch keine Einreichungen.'
    NO_SUBMISSION: 'Einreichung nicht gefunden.'
    CONFIRM_DELETE_SUBMISSION: 'Diese Einreichung löschen? Das kann nicht rückgängig gemacht werden.'
    SUBMISSION_DELETED: 'Einreichung gelöscht.'
    PREVIEW: 'Vorschau'
    PREVIEW_BANNER: 'Vorschau — das zeigt den zuletzt gespeicherten Stand des Formulars und kann hier nicht abgeschickt werden. Zuerst speichern, damit Änderungen hier sichtbar werden.'
    PREVIEW_NOT_SAVED: 'Dieses Formular wurde noch nicht gespeichert. Bitte zuerst speichern, um eine Vorschau zu sehen.'
    PREVIEW_ERROR: 'Die Vorschau konnte nicht erstellt werden.'
    PREVIEW_SAVE_FIRST: 'Dieses Formular zuerst speichern, um es in der Vorschau zu sehen.'
    SAVED: 'Formular gespeichert.'
    DELETED: 'Formular gelöscht.'
    ERROR_INVALID_NAME: 'Bitte einen gültigen Formularnamen angeben (nur Kleinbuchstaben, Zahlen und Bindestriche).'
    ERROR_NAME_TAKEN: 'Ein Formular mit diesem Namen existiert bereits.'
    FIELD_GITHUB_REPO: 'GitHub-Repository'
    FIELD_GITHUB_REPO_HELP: 'owner/repo, z. B. "meinbenutzername/easyforms". Leer lassen, um Update-Prüfungen zu deaktivieren.'
    UPDATE_TITLE: 'Update'
    CURRENT_VERSION: 'Aktuelle Version'
    LATEST_VERSION: 'Neueste Version'
    RELEASE_NOTES: 'Release-Hinweise'
    APPLY_UPDATE: 'Jetzt aktualisieren'
    APPLY_UPDATE_HELP: 'Lädt das neueste GitHub-Release herunter und installiert es. Die vorherige Version bleibt als Backup-Ordner neben dem Plugin erhalten.'
    UPDATE_AVAILABLE: 'Update verfügbar'
    UPDATE_CHECK_FAILED: 'Update-Prüfung fehlgeschlagen'
    CONFIRM_UPDATE: 'Easy Forms jetzt aktualisieren? Die Seite ist während des Dateiaustauschs kurz beeinträchtigt.'
