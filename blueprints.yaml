name: Easy Forms
slug: easyform
type: plugin
version: 0.2.0
description: Manage Grav forms as standalone entities from the Admin panel and embed them anywhere via shortcode or Twig function.
icon: wpforms
author:
  name: findmichonline
homepage: https://github.com/alex01at/easyform
keywords: form, forms, admin, shortcode, builder
license: MIT

compatibility:
  grav: '>=1.7.0'
  php: '>=8.1.0'

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: form, version: '>=6.0.0' }
  - { name: admin, version: '>=1.10.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: true
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    github_repo:
      type: text
      label: PLUGIN_EASYFORMS.FIELD_GITHUB_REPO
      help: PLUGIN_EASYFORMS.FIELD_GITHUB_REPO_HELP
      placeholder: 'owner/easyform'

    antispam_turnstile_site_key:
      type: text
      label: PLUGIN_EASYFORMS.FIELD_GLOBAL_TURNSTILE_SITE_KEY
      help: PLUGIN_EASYFORMS.FIELD_GLOBAL_KEY_HELP

    antispam_turnstile_secret_key:
      type: text
      label: PLUGIN_EASYFORMS.FIELD_GLOBAL_TURNSTILE_SECRET_KEY
      help: PLUGIN_EASYFORMS.FIELD_GLOBAL_KEY_HELP

    antispam_recaptcha_site_key:
      type: text
      label: PLUGIN_EASYFORMS.FIELD_GLOBAL_RECAPTCHA_SITE_KEY
      help: PLUGIN_EASYFORMS.FIELD_GLOBAL_KEY_HELP

    antispam_recaptcha_secret_key:
      type: text
      label: PLUGIN_EASYFORMS.FIELD_GLOBAL_RECAPTCHA_SECRET_KEY
      help: PLUGIN_EASYFORMS.FIELD_GLOBAL_KEY_HELP
