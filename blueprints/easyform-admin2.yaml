title: PLUGIN_EASYFORMS.MENU

form:
  validation: loose
  fields:
    intro:
      type: section
      text: PLUGIN_EASYFORMS.INTRO_HELP

    forms:
      type: list
      label: PLUGIN_EASYFORMS.MENU
      style: vertical
      collapsed: true
      btnLabel: PLUGIN_EASYFORMS.ADD

      fields:
        .name:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_NAME
          help: PLUGIN_EASYFORMS.FIELD_NAME_HELP
          validate:
            required: true
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'

        .title:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_TITLE
          help: PLUGIN_EASYFORMS.FIELD_TITLE_HELP

        .shortcode:
          type: text
          label: PLUGIN_EASYFORMS.COL_SHORTCODE
          help: PLUGIN_EASYFORMS.FIELD_SHORTCODE_HELP
          readonly: true

        .submissions_summary:
          type: easyform-submissions
          label: PLUGIN_EASYFORMS.SUBMISSIONS

        .fields:
          type: list
          label: PLUGIN_EASYFORMS.FIELD_FIELDS
          style: vertical
          collapsed: true
          btnLabel: PLUGIN_EASYFORMS.ADD_FIELD

          fields:
            .name:
              type: text
              label: PLUGIN_EASYFORMS.FIELD_FIELDNAME
              validate:
                required: true

            .label:
              type: text
              label: PLUGIN_EASYFORMS.FIELD_LABEL

            .type:
              type: select
              label: PLUGIN_EASYFORMS.FIELD_TYPE
              default: text
              options:
                text: PLUGIN_EASYFORMS.TYPE_TEXT
                email: PLUGIN_EASYFORMS.TYPE_EMAIL
                textarea: PLUGIN_EASYFORMS.TYPE_TEXTAREA
                date: PLUGIN_EASYFORMS.TYPE_DATE
                checkbox: PLUGIN_EASYFORMS.TYPE_CHECKBOX
                select: PLUGIN_EASYFORMS.TYPE_SELECT
                file: PLUGIN_EASYFORMS.TYPE_FILE

            .placeholder:
              type: text
              label: PLUGIN_EASYFORMS.FIELD_PLACEHOLDER

            .required:
              type: toggle
              label: PLUGIN_EASYFORMS.FIELD_REQUIRED
              default: 0
              options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
              validate:
                type: bool

            .show_if_field:
              type: text
              label: PLUGIN_EASYFORMS.FIELD_SHOW_IF_FIELD
              help: PLUGIN_EASYFORMS.FIELD_SHOW_IF_FIELD_HELP

            .show_if_value:
              type: text
              label: PLUGIN_EASYFORMS.FIELD_SHOW_IF_VALUE
              help: PLUGIN_EASYFORMS.FIELD_SHOW_IF_VALUE_HELP

            .options:
              type: list
              label: PLUGIN_EASYFORMS.FIELD_OPTIONS
              help: PLUGIN_EASYFORMS.FIELD_OPTIONS_HELP
              style: vertical
              collapsed: true
              fields:
                .key:
                  type: text
                  label: PLUGIN_EASYFORMS.FIELD_OPTION_KEY
                .value:
                  type: text
                  label: PLUGIN_EASYFORMS.FIELD_OPTION_VALUE

        .email_enabled:
          type: toggle
          label: PLUGIN_EASYFORMS.FIELD_EMAIL_ENABLED
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .to:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_TO
          help: PLUGIN_EASYFORMS.FIELD_TO_HELP
          placeholder: 'name@domain.de'

        .from:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_FROM
          help: PLUGIN_EASYFORMS.FIELD_FROM_HELP
          placeholder: 'name@domain.de'

        .reply_to:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_REPLY_TO
          help: PLUGIN_EASYFORMS.FIELD_REPLY_TO_HELP
          placeholder: 'name@domain.de'

        .subject:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_SUBJECT

        .message:
          type: textarea
          label: PLUGIN_EASYFORMS.FIELD_MESSAGE
          default: PLUGIN_EASYFORMS.DEFAULT_MESSAGE

        .reset:
          type: toggle
          label: PLUGIN_EASYFORMS.FIELD_RESET
          default: 1
          options:
            1: PLUGIN_ADMIN.YES
            0: PLUGIN_ADMIN.NO
          validate:
            type: bool

        .redirect:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_REDIRECT
          placeholder: /danke

        .save_enabled:
          type: toggle
          label: PLUGIN_EASYFORMS.FIELD_SAVE_ENABLED
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .storage_retention_days:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_RETENTION_DAYS
          help: PLUGIN_EASYFORMS.FIELD_RETENTION_DAYS_HELP
          placeholder: '0'
          validate:
            type: int
            min: 0

        .autoresponder_enabled:
          type: toggle
          label: PLUGIN_EASYFORMS.FIELD_AUTORESPONDER_ENABLED
          help: PLUGIN_EASYFORMS.FIELD_AUTORESPONDER_ENABLED_HELP
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .autoresponder_field:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_AUTORESPONDER_FIELD
          help: PLUGIN_EASYFORMS.FIELD_AUTORESPONDER_FIELD_HELP
          placeholder: email

        .autoresponder_from:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_FROM
          help: PLUGIN_EASYFORMS.FIELD_FROM_HELP
          placeholder: 'name@domain.de'

        .autoresponder_subject:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_SUBJECT

        .autoresponder_message:
          type: textarea
          label: PLUGIN_EASYFORMS.FIELD_AUTORESPONDER_MESSAGE
          help: PLUGIN_EASYFORMS.FIELD_AUTORESPONDER_MESSAGE_HELP
          default: PLUGIN_EASYFORMS.DEFAULT_AUTORESPONDER_MESSAGE

        .antispam_method:
          type: select
          label: PLUGIN_EASYFORMS.FIELD_ANTISPAM_METHOD
          help: PLUGIN_EASYFORMS.FIELD_ANTISPAM_METHOD_HELP
          default: honeypot
          options:
            none: PLUGIN_EASYFORMS.ANTISPAM_NONE
            honeypot: PLUGIN_EASYFORMS.ANTISPAM_HONEYPOT
            math: PLUGIN_EASYFORMS.ANTISPAM_MATH
            turnstile: PLUGIN_EASYFORMS.ANTISPAM_TURNSTILE
            recaptcha: PLUGIN_EASYFORMS.ANTISPAM_RECAPTCHA

        .antispam_honeypot_field:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_HONEYPOT_NAME
          help: PLUGIN_EASYFORMS.FIELD_HONEYPOT_NAME_HELP
          placeholder: website_hp

        .antispam_honeypot_message:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_HONEYPOT_MESSAGE
          help: PLUGIN_EASYFORMS.FIELD_HONEYPOT_MESSAGE_HELP

        .antispam_math_label:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_MATH_LABEL
          help: PLUGIN_EASYFORMS.FIELD_MATH_LABEL_HELP
          default: PLUGIN_EASYFORMS.DEFAULT_MATH_LABEL

        .antispam_math_message:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_MATH_MESSAGE
          default: PLUGIN_EASYFORMS.DEFAULT_MATH_MESSAGE

        .antispam_site_key:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_ANTISPAM_SITE_KEY
          help: PLUGIN_EASYFORMS.FIELD_ANTISPAM_SITE_KEY_HELP

        .antispam_secret_key:
          type: text
          label: PLUGIN_EASYFORMS.FIELD_ANTISPAM_SECRET_KEY
          help: PLUGIN_EASYFORMS.FIELD_ANTISPAM_SECRET_KEY_HELP

    update_section:
      type: section
      title: PLUGIN_EASYFORMS.UPDATE_TITLE
      underline: true

    update_current_version:
      type: text
      label: PLUGIN_EASYFORMS.CURRENT_VERSION
      readonly: true

    update_latest_version:
      type: text
      label: PLUGIN_EASYFORMS.LATEST_VERSION
      readonly: true

    update_notes:
      type: textarea
      label: PLUGIN_EASYFORMS.RELEASE_NOTES
      readonly: true
      rows: 4

    apply_update:
      type: toggle
      label: PLUGIN_EASYFORMS.APPLY_UPDATE
      help: PLUGIN_EASYFORMS.APPLY_UPDATE_HELP
      default: 0
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool
